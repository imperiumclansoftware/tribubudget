# Checks every change: tests, static analysis and code style of the API; tests and build of the app.
# Also called by the release workflow before a release is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d app -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          tools: composer:v2

      - name: Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Test database
        run: php bin/console doctrine:database:create --env=test --if-not-exists

      - name: Tests
        run: php bin/phpunit

      - name: Static analysis
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npx ng test --watch=false
      - run: npx ng build
