<main class="auth-card card">
  <div class="brand">
    <span class="logo"><app-icon name="piggy" [size]="34" /></span>
    <h1>Créer l’espace de ma famille</h1>
    <p>Vous serez parent : vous ajouterez ensuite les autres membres.</p>
  </div>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span>Nom de la famille</span>
      <input formControlName="familyName" placeholder="Famille Martin" />
    </label>
    <label class="field">
      <span>Votre prénom</span>
      <input formControlName="displayName" autocomplete="given-name" />
    </label>
    <label class="field">
      <span>Identifiant de connexion</span>
      <input formControlName="username" autocomplete="username" autocapitalize="none" />
      <small class="hint">Lettres, chiffres, points ou tirets.</small>
    </label>
    <label class="field">
      <span>Mot de passe</span>
      <input formControlName="password" type="password" autocomplete="new-password" />
      <small class="hint">8 caractères au moins.</small>
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="pending()">
      {{ pending() ? 'Création…' : 'Créer ma famille' }}
    </button>
  </form>

  <p class="switch">Déjà inscrit ? <a routerLink="/connexion">Se connecter</a></p>
</main>
