# TribuBudget: the Angular application, and the Symfony API through PHP-FPM. HTTP only: put a
# reverse proxy in front for HTTPS. The master process opens port 80 and the logs as root, the
# workers serve as www-data.
user www-data;
# A family's traffic: two workers are plenty
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	# Missing from Alpine's list: the manifest of the app (icons on a phone's home screen)
	types {
		application/manifest+json webmanifest;
	}
	default_type application/octet-stream;
	server_tokens off;
	sendfile on;
	access_log off;

	client_body_temp_path /tmp/nginx/body;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	proxy_temp_path /tmp/nginx/proxy;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	# The pages always fresh, the scripts and styles (hashed names) cached for good
	map $uri $cache_control {
		/index.html "no-cache";
		~\.(js|css)$ "public, max-age=31536000, immutable";
		default "";
	}

	server {
		listen 80 default_server;
		root /app/public;

		add_header Cache-Control $cache_control;
		add_header X-Content-Type-Options nosniff;
		add_header Referrer-Policy strict-origin-when-cross-origin;
		add_header X-Frame-Options DENY;

		# PHP only runs behind /api: no PHP source, nor hidden file, is ever served
		location ~ \.php$ {
			return 404;
		}
		location ~ /\. {
			return 404;
		}

		# API: Symfony
		location /api/ {
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root/index.php;
			fastcgi_param SCRIPT_NAME /index.php;
			fastcgi_pass 127.0.0.1:9000;
		}

		# Angular application: files, or index.html for its routes
		location / {
			try_files $uri /index.html;
		}
	}
}
