# TribuBudget: the Angular application, and the Symfony API through PHP-FPM. HTTP only: put a
# reverse proxy in front for HTTPS. The master process opens port 80 and the logs as root, the
# workers serve as www-data.
user www-data;
# A family's traffic: two workers are plenty
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	# Missing from Alpine's list: the manifest of the app (icons on a phone's home screen)
	types {
		application/manifest+json webmanifest;
	}
	default_type application/octet-stream;
	server_tokens off;
	sendfile on;
	access_log off;

	client_body_temp_path /tmp/nginx/body;
	fastcgi_temp_path /tmp/nginx/fastcgi;
	proxy_temp_path /tmp/nginx/proxy;
	uwsgi_temp_path /tmp/nginx/uwsgi;
	scgi_temp_path /tmp/nginx/scgi;

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml text/plain;

	# HSTS only for a request that came over HTTPS (directly or through the reverse proxy): a family
	# may also open the app over plain HTTP on its home network (docs/adr/0001-session-cookie.md)
	map $http_x_forwarded_proto $forwarded_https {
		https on;
		default $https;
	}
	map $forwarded_https $hsts {
		on "max-age=31536000; includeSubDomains";
		default "";
	}

	# The pages always fresh, the scripts and styles (hashed names) cached for good
	map $uri $cache_control {
		/index.html "no-cache";
		~\.(js|css)$ "public, max-age=31536000, immutable";
		default "";
	}

	server {
		listen 80 default_server;
		root /app/public;

		# Security headers of the Angular application (guidelines: "En-têtes HTTP"). At server level
		# only: an add_header in a location drops these (which /api/ does on purpose, see below).
		# Strict CSP with Trusted Types: no inline script, no eval; Angular's own policies only.
		add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler" always;
		add_header Strict-Transport-Security $hsts always;
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Cross-Origin-Opener-Policy same-origin always;
		add_header X-Frame-Options DENY always;
		add_header Cache-Control $cache_control;

		# PHP only runs behind /api: no PHP source, nor hidden file, is ever served
		location ~ \.php$ {
			return 404;
		}
		location ~ /\. {
			return 404;
		}
		# No source maps in production (none are built; never serve one)
		location ~* \.map$ {
			return 404;
		}

		# API: Symfony
		location /api/ {
			# The API's headers come from Symfony (nelmio_security.yaml); only HSTS from here
			add_header Strict-Transport-Security $hsts always;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root/index.php;
			fastcgi_param SCRIPT_NAME /index.php;
			fastcgi_pass 127.0.0.1:9000;
		}

		# Angular application: files, or index.html for its routes
		location / {
			try_files $uri /index.html;
		}
	}
}
