# TribuBudget, all in one (application, database, scheduler): nothing to fill in.
#   Command line: docker compose up -d   (optional: a .env from .env.example)
#   Portainer: paste this file as a stack.
# Then: docker logs tribubudget   gives the installation code, asked at http://<server>:8080

services:
  tribubudget:
    image: iemperor/tribubudget:${TRIBUBUDGET_VERSION:-latest}
    container_name: tribubudget
    restart: unless-stopped
    ports:
      - "${TRIBUBUDGET_PORT:-8080}:80"
    environment:
      # Time zone of "today": dates of the allowances and of the recurring operations
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
    volumes:
      # Database, secrets and keys: back this volume up
      - tribubudget_data:/data
    # Time for the database to shut down cleanly
    stop_grace_period: 30s

volumes:
  tribubudget_data:
