; PHP-FPM pool of TribuBudget, after the image's own www.conf (workers as www-data) and docker.conf
[www]
; Reachable by nginx only
listen = 127.0.0.1:9000
; The variables of the container (APP_TIMEZONE…) reach the application
clear_env = no
; nginx is the one in front: no access log of its own
access.log = /dev/null
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
