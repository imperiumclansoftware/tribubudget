nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # The app and the API are on the same site (no CORS needed); this list only serves local tools
        allow_headers: ['Content-Type', 'X-XSRF-TOKEN']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null
