security:
    password_hashers:
        # Argon2id (libsodium). Hashes made before 0.6.0 (bcrypt, "auto") are still checked, and
        # replaced by Argon2id at the member's next sign-in (UserRepository::upgradePassword()).
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium
            migrate_from:
                - bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Session cookie (HttpOnly, SameSite=Lax), no token in the browser: docs/adr/0001-session-cookie.md.
            # A successful sign-in goes on to AuthController::login(), which answers with the member.
            json_login:
                check_path: api_login
                username_path: username
                password_path: password
                failure_handler: App\Security\LoginFailureHandler
            # A child's PIN is short: slow down guessing (per username and per IP)
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout

    # Parents and teenagers both record operations and transfers, each on the accounts they may
    # use (FamilyLookup, OperationVoter)
    role_hierarchy:
        ROLE_PARENT: [ROLE_USER, ROLE_ACCOUNT_HOLDER]
        ROLE_TEEN: [ROLE_USER, ROLE_ACCOUNT_HOLDER]
        ROLE_CHILD: ROLE_USER

    # Denied by default: every /api route needs a signed-in member, the public ones are listed
    # first. Only the *first* matching rule is applied; the finer rights (parent or child, same
    # family) are checked by the controllers and the voters.
    access_control:
        - { path: ^/api/(login|health)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/setup(/verify)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
